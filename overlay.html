<!doctype html>
<html lang="en" data-connection="waiting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arknights Pull Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      font-variant-numeric: tabular-nums;
      --ink: #f5f7fa;
      --muted: #b1bac8;
      --accent: #ffc46b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { padding: 16px; color: var(--ink); }

    .tracker {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-top: 3px solid var(--accent);
      border-radius: 12px;
      background: rgba(13, 19, 29, .92);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 27px; font-weight: 650; letter-spacing: -.03em; }
    .connection { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; color: #ffd18c; font-size: 10px; font-weight: 700; letter-spacing: .07em; }
    .connection::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    html[data-connection="live"] .connection { color: #91e1b2; }

    .pity { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0 12px; padding-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, .14); }
    .stat-label { display: block; color: var(--muted); font-size: 12px; }
    .stat-value { display: block; margin-top: 4px; font-size: 34px; line-height: 1.15; font-weight: 700; }
    .chance { color: var(--accent); }

    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 0; }
    .rarity { flex: 0 0 auto; color: var(--rarity); font-size: 17px; font-weight: 600; }
    .six { --rarity: #ff9e60; }
    .five { --rarity: #ffd66e; }
    .four { --rarity: #c9a6ff; }
    .three { --rarity: #9cc7ff; }
    .counts { display: inline-flex; align-items: baseline; justify-content: flex-end; gap: 10px; white-space: nowrap; }
    .count { font-size: 26px; line-height: 1; font-weight: 700; }
    .new { color: var(--muted); font-size: 13px; }
    .total { margin-top: 8px; padding-top: 20px; padding-bottom: 0; border-top: 1px solid rgba(255, 255, 255, .14); }
    .total .rarity { color: var(--ink); font-size: 15px; }
    .total .count { font-size: 30px; }

    @media (max-width: 380px) {
      body { padding: 10px; }
      .tracker { padding: 18px; }
      h1 { font-size: 23px; }
      .counts { gap: 7px; }
      .new { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="tracker" aria-label="Pull statistics">
    <p class="eyebrow">Arknights / Headhunting</p>
    <div class="heading">
      <h1>Pull Tracker</h1>
      <span class="connection" id="connection" role="status">WAITING</span>
    </div>

    <section class="pity" aria-label="Six-star pity">
      <div>
        <span class="stat-label">Pity count</span>
        <strong class="stat-value" id="pityCount">—</strong>
      </div>
      <div>
        <span class="stat-label">Next pull · 6★ chance</span>
        <strong class="stat-value chance"><span id="sixStarChance">—</span>%</strong>
      </div>
    </section>

    <div class="row six">
      <span class="rarity">6-Stars</span>
      <span class="counts"><strong class="count" id="sixStarCount">—</strong><span class="new">(<span id="sixStarNew">—</span> new!)</span></span>
    </div>
    <div class="row five">
      <span class="rarity">5-Stars</span>
      <span class="counts"><strong class="count" id="fiveStarCount">—</strong><span class="new">(<span id="fiveStarNew">—</span> new!)</span></span>
    </div>
    <div class="row four">
      <span class="rarity">4-Stars</span>
      <span class="counts"><strong class="count" id="fourStarCount">—</strong><span class="new">(<span id="fourStarNew">—</span> new!)</span></span>
    </div>
    <div class="row three">
      <span class="rarity">3-Stars</span>
      <span class="counts"><strong class="count" id="threeStarCount">—</strong><span class="new">(<span id="threeStarNew">—</span> new!)</span></span>
    </div>
    <div class="row total">
      <span class="rarity">Total pulls</span>
      <span class="counts"><strong class="count" id="totalPullCount">—</strong><span class="new">(<span id="totalNew">—</span> new!)</span></span>
    </div>
    <noscript>This overlay needs JavaScript enabled to display the tracker.</noscript>
  </main>

  <script>
    // Each JSON property corresponds to one element with the same id.
    const fields = [
      "pityCount", "sixStarChance", "sixStarCount", "sixStarNew",
      "fiveStarCount", "fiveStarNew", "fourStarCount", "fourStarNew",
      "threeStarCount", "threeStarNew", "totalPullCount", "totalNew"
    ];

    async function refreshState() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 2000);

      try {
        // A relative URL uses the same server that supplied this HTML page.
        const response = await fetch("/state", {
          cache: "no-store",
          signal: controller.signal
        });
        if (!response.ok) throw new Error("Tracker returned " + response.status);
        const state = await response.json();

        // Validate before changing any text so an incomplete response cannot
        // leave half the display showing a different snapshot.
        if (!fields.every(key => Number.isInteger(state[key]) && state[key] >= 0)) {
          throw new Error("Tracker returned invalid counter data");
        }
        for (const key of fields) {
          document.getElementById(key).textContent = state[key];
        }
        document.documentElement.dataset.connection = "live";
        document.getElementById("connection").textContent = "LIVE";
      } catch (error) {
        // Keep the last good numbers visible if the tracker stops, and retry
        // automatically so restarting the tracker does not require a reload.
        document.documentElement.dataset.connection = "waiting";
        document.getElementById("connection").textContent = "RECONNECTING";
      } finally {
        clearTimeout(timeout);
        // Schedule the next request after this one finishes, avoiding overlaps.
        setTimeout(refreshState, 250);
      }
    }

    refreshState();
  </script>
</body>
</html>
